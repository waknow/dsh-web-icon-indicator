# Publish to npm on version tags (vX.Y.Z). The package is zero-build, so
# "publishing" is just verifying the pack list and running `npm publish`.
#
# Required repo setup (one-time, manual):
#   - an npm automation token (https://www.npmjs.com/settings/<user>/tokens)
#     stored as the `NPM_TOKEN` secret in Settings → Secrets and variables
#   - for the tag version to be published, package.json `version` must equal
#     the tag (checked below); bump first, then `git tag v<version>` + push
#
# Optional hardening: add `--provenance` to the publish step and
# `id-token: write` under `permissions` to attach sigstore attestations
# (requires a public repo and npmjs 2FA).

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # manual re-run from the Actions tab

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sanity-check the publish contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
